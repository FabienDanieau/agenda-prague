<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praha — agenda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:#0b0b0d; --panel:#141417; --line:#26262b;
    --fg:#eceaf0; --muted:#8e8a96; --accent:#e84a5f; --accent-dim:#2a1418;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    /* one source of truth for category colour: the filter chips and the map pins read these */
    --cat-music:#e84a5f; --cat-culture:#4aa3e8; --cat-science:#4ae8a3; --cat-sport:#e8c34a;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:880px; margin:0 auto; padding:0 16px 80px; }

  header { padding:48px 0 24px; }
  h1 { margin:0; font-size:clamp(34px,7vw,52px); letter-spacing:-.03em; font-weight:800; }
  h1 span { color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; font-family:var(--mono); margin-top:8px; }

  .controls { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 0; border-bottom:1px solid var(--line); }
  input[type=search] {
    width:100%; padding:11px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--fg); font-size:15px;
  }
  input[type=search]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip {
    border:1px solid var(--line); background:transparent; color:var(--muted);
    padding:5px 11px; border-radius:999px; font-size:12.5px; cursor:pointer; font-family:var(--mono);
  }
  .chip:hover { color:var(--fg); border-color:var(--muted); }
  .chip[aria-pressed=true] { background:var(--accent-dim); border-color:var(--accent); color:var(--fg); }
  .chips.cats .chip { font-size:13.5px; padding:6px 15px; font-family:inherit; letter-spacing:.01em; }
  /* the dot is the legend: same colour as this category's pins on the map */
  .chips.cats .chip::before {
    content:""; display:inline-block; width:9px; height:9px; border-radius:50%;
    background:var(--cat); margin-right:8px; vertical-align:baseline;
  }
  /* a tint rather than a solid fill -- science green and sport amber are too light to carry
     white text, and the four chips must stay equally legible */
  .chips.cats .chip[aria-pressed=true] {
    background:color-mix(in srgb, var(--cat) 20%, transparent);
    border-color:var(--cat); color:var(--fg); font-weight:600;
  }

  /* 40+ venues will not fit as inline chips, so they live in a native disclosure menu */
  .menu { margin-top:8px; position:relative; }
  .menu > summary {
    list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:999px; padding:5px 13px;
    font-family:var(--mono); font-size:12.5px; color:var(--muted); user-select:none;
  }
  .menu > summary::-webkit-details-marker { display:none; }
  .menu > summary:hover { color:var(--fg); border-color:var(--muted); }
  .menu[open] > summary { color:var(--fg); border-color:var(--muted); }
  .menu > summary .caret { transition:transform .15s; }
  .menu[open] > summary .caret { transform:rotate(180deg); }
  .menu > summary .n { background:var(--accent); color:#fff; border-radius:999px; padding:0 7px; font-weight:600; }
  .menu-panel {
    position:absolute; z-index:20; margin-top:6px; width:min(640px, calc(100vw - 32px));
    max-height:46vh; overflow:auto; padding:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    box-shadow:0 18px 40px rgba(0,0,0,.55);
  }
  .menu-panel .chips { margin-top:0; }
  .menu-tools { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .menu-tools input { flex:1; padding:7px 11px; font-size:13px; border-radius:7px;
                      border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .menu-tools button {
    background:none; border:none; color:var(--accent); cursor:pointer;
    font-size:12.5px; font-family:var(--mono); padding:4px 2px;
  }
  .chip.hide { display:none; }

  /* view switch */
  .views { display:flex; gap:4px; margin-top:10px; }
  .views button {
    background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
    padding:6px 16px; border-radius:8px; font-size:13.5px; font-family:inherit;
  }
  .views button[aria-selected=true] { background:var(--fg); border-color:var(--fg); color:var(--bg); font-weight:600; }
  .views button:hover:not([aria-selected=true]) { color:var(--fg); border-color:var(--muted); }

  /* map view */
  #mapWrap[hidden], #list[hidden] { display:none; }
  .days { display:flex; gap:6px; overflow-x:auto; padding:14px 0 12px; scrollbar-width:thin; }
  .day-btn {
    flex:none; border:1px solid var(--line); background:transparent; color:var(--muted);
    border-radius:9px; padding:6px 11px; cursor:pointer; font-family:var(--mono); font-size:12px;
    line-height:1.3; text-align:center; min-width:58px;
  }
  .day-btn b { display:block; font-size:16px; color:var(--fg); }
  .day-btn:hover { border-color:var(--muted); }
  .day-btn[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .day-btn[aria-pressed=true] b { color:#fff; }
  #map { height:min(68vh, 620px); border-radius:12px; border:1px solid var(--line); background:var(--panel); }
  .map-note { color:var(--muted); font-size:12.5px; font-family:var(--mono); padding:8px 2px 0; }

  /* OSM tiles are light; tone them down so the dark page stays readable */
  .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }
  .leaflet-container { background:var(--panel); font:inherit; }
  .leaflet-control-attribution { background:rgba(11,11,13,.8) !important; color:var(--muted) !important; }
  .leaflet-control-attribution a { color:var(--muted) !important; }
  .pin {
    width:26px; height:26px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg);
    border:2px solid rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
    font:700 11px/1 system-ui, sans-serif; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .pin span { transform:rotate(45deg); }
  .leaflet-tooltip.ev-tip {
    background:var(--panel); border:1px solid var(--line); color:var(--fg);
    box-shadow:0 10px 30px rgba(0,0,0,.6); border-radius:9px; padding:10px 12px;
    font-size:13px; white-space:normal;
    /* Leaflet panes are 0px wide, so an absolutely positioned tooltip with white-space:normal
       shrinks to its longest word. max-content ignores the available width; the clamp keeps
       it readable. Without the explicit width the box renders one word per line. */
    width:max-content; max-width:min(320px, 68vw);
  }
  .leaflet-tooltip.ev-tip::before { border-top-color:var(--line); }
  .ev-tip b { display:block; font-size:13.5px; margin-bottom:6px; }
  .ev-tip .t { color:var(--accent); font-family:var(--mono); font-size:11.5px; }
  .ev-tip .row { display:flex; gap:7px; align-items:baseline; }
  .ev-tip .row + .row { margin-top:4px; }
  .ev-tip .row .t { flex:none; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
  }
  .leaflet-popup-content { margin:11px 13px; font-size:13px; }
  .leaflet-popup-content a { color:var(--accent); }

  .day { display:grid; grid-template-columns:96px 1fr; gap:18px; padding:20px 0; border-bottom:1px solid var(--line); }
  .day-label { font-family:var(--mono); font-size:13px; color:var(--muted); line-height:1.35; position:sticky; top:108px; align-self:start; }
  .day-label b { display:block; color:var(--fg); font-size:26px; font-weight:700; letter-spacing:-.02em; }
  .day-label .soon { color:var(--accent); }

  .ev { padding:9px 0; display:grid; grid-template-columns:64px 1fr; gap:12px; align-items:start; }
  .ev + .ev { border-top:1px dashed var(--line); }
  .thumb {
    width:64px; height:64px; border-radius:7px; overflow:hidden; background:var(--panel);
    border:1px solid var(--line); display:block; flex:none;
  }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  /* honest placeholder: an event with no picture gets a tinted monogram, never a wrong thumbnail */
  .thumb.none {
    background:linear-gradient(135deg, var(--panel), var(--accent-dim));
    display:flex; align-items:center; justify-content:center;
    font:600 22px/1 system-ui, sans-serif; color:var(--muted); text-decoration:none;
  }
  .ev a.t, .ev span.t { font-weight:600; font-size:16.5px; color:var(--fg); text-decoration:none; }
  .ev a.t:hover { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
  .sub { margin-top:3px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .venue { color:var(--fg); }
  .time { font-family:var(--mono); color:var(--accent); font-size:12.5px; }
  .room, .tag { font-family:var(--mono); font-size:11.5px; border:1px solid var(--line); padding:1px 6px; border-radius:5px; }
  .tag { border-style:dashed; }
  .info { margin-top:4px; font-size:13.5px; color:var(--muted); }
  .month { font-size:12px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.14em;
           color:var(--accent); padding:30px 0 6px; }
  .empty { padding:60px 0; text-align:center; color:var(--muted); }
  @media (max-width:560px) {
    .day { grid-template-columns:1fr; gap:6px; }
    .day-label { position:static; display:flex; gap:8px; align-items:baseline; }
    .day-label b { font-size:20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Praha<span>.</span></h1>
    <div class="meta" id="meta">loading…</div>
  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="Hledat akci nebo místo…" aria-label="Hledat">
    <div class="chips cats" id="cats"></div>
    <details class="menu" id="venueMenu">
      <summary>Místa <span class="n" id="venueCount" hidden>0</span><span class="caret">▾</span></summary>
      <div class="menu-panel">
        <div class="menu-tools">
          <input type="search" id="venueQ" placeholder="Filtrovat místa…" aria-label="Filtrovat místa">
          <button type="button" id="venueClear">vymazat</button>
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </details>
    <div class="views" role="tablist">
      <button type="button" role="tab" data-view="list" aria-selected="true">Seznam</button>
      <button type="button" role="tab" data-view="map" aria-selected="false">Mapa</button>
    </div>
  </div>

  <div id="mapWrap" hidden>
    <div class="days" id="days"></div>
    <div id="map"></div>
    <div class="map-note" id="mapNote"></div>
  </div>

  <div id="list"></div>
</div>

<script>
const fmtDay   = new Intl.DateTimeFormat('cs-CZ', { weekday:'short' });
const fmtMonth = new Intl.DateTimeFormat('cs-CZ', { month:'long', year:'numeric' });
const $ = id => document.getElementById(id);

let DATA = { events: [] }, active = new Set(), cats = new Set(), query = '';
let view = 'list', selectedDay = null;

const CAT_LABEL = { music: 'Hudba', culture: 'Kultura', science: 'Věda', sport: 'Sport', other: 'Ostatní' };

const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

fetch('events.json')
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { DATA = d; boot(); })
  .catch(e => $('meta').textContent = `events.json nenalezen (${e}) — spusť: python3 harvest.py`);

function chip(box, label, toggle) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.type = 'button';
  b.setAttribute('aria-pressed', 'false');
  b.textContent = label;
  b.onclick = () => { b.setAttribute('aria-pressed', String(toggle())); render(); };
  box.append(b);
  return b;
}

function boot() {
  $('meta').textContent =
    `${DATA.count} akcí · ${DATA.venues.length} míst · aktualizováno ${DATA.generated}`;

  // categories first: the coarse cut most people want
  (DATA.categories || []).forEach(c => {
    const n = DATA.by_category?.[c] ?? 0;
    const b = chip($('cats'), `${CAT_LABEL[c] || c} ${n}`,
         () => { cats.has(c) ? cats.delete(c) : cats.add(c); return cats.has(c); });
    b.style.setProperty('--cat', catColor(c));
  });

  const counts = {};
  DATA.events.forEach(e => counts[e.venue] = (counts[e.venue] || 0) + 1);
  const venueChips = DATA.venues
    .slice().sort((a,b) => counts[b] - counts[a])
    .map(v => {
      const b = chip($('chips'), `${v} ${counts[v]}`,
        () => { active.has(v) ? active.delete(v) : active.add(v); return active.has(v); });
      b.dataset.venue = v.toLowerCase();
      return b;
    });

  function syncVenueCount() {
    const n = $('venueCount');
    n.textContent = active.size;
    n.hidden = active.size === 0;
  }
  // the menu's own filter only hides chips; it never changes what is selected
  $('venueQ').addEventListener('input', e => {
    const t = e.target.value.toLowerCase().trim();
    venueChips.forEach(b => b.classList.toggle('hide', !!t && !b.dataset.venue.includes(t)));
  });
  $('venueClear').addEventListener('click', () => {
    active.clear();
    venueChips.forEach(b => b.setAttribute('aria-pressed', 'false'));
    syncVenueCount();
    render();
  });
  $('chips').addEventListener('click', syncVenueCount);

  $('q').addEventListener('input', e => { query = e.target.value.toLowerCase().trim(); render(); });

  document.querySelectorAll('.views button').forEach(b => {
    b.onclick = () => {
      view = b.dataset.view;
      document.querySelectorAll('.views button')
        .forEach(x => x.setAttribute('aria-selected', String(x === b)));
      render();
    };
  });

  render();
}

// ---------------------------------------------------------------- map

const CAT_COLOR = { music: '#e84a5f', culture: '#4aa3e8', science: '#4ae8a3', sport: '#e8c34a' };
let map = null, layer = null;

// read the colour from CSS so the chips and the pins can never drift apart
function catColor(cat) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(`--cat-${cat}`).trim();
  return v || CAT_COLOR[cat] || '#8e8a96';
}

function visible() {
  return DATA.events.filter(e =>
    (!cats.size || cats.has(e.category)) &&
    (!active.size || active.has(e.venue)) &&
    (!query || (e.title + ' ' + e.venue + ' ' + (e.tag || '') + ' ' + (e.info || '')).toLowerCase().includes(query))
  );
}

function renderMap(shown) {
  // Leaflet loads with `defer`, so it may not exist yet on a fast first paint
  if (!window.L) { setTimeout(() => renderMap(shown), 120); return; }

  const places = DATA.places || {};
  const byDay = new Map();
  for (const e of shown) (byDay.get(e.date) || byDay.set(e.date, []).get(e.date)).push(e);
  const days = [...byDay.keys()].sort();

  if (!days.includes(selectedDay)) selectedDay = days[0] || null;

  // day strip
  const strip = $('days');
  strip.textContent = '';
  for (const day of days) {
    const d = parse(day);
    const b = document.createElement('button');
    b.className = 'day-btn';
    b.type = 'button';
    b.setAttribute('aria-pressed', String(day === selectedDay));
    b.innerHTML = `<b>${d.getDate()}.${d.getMonth()+1}.</b>${fmtDay.format(d)} · ${byDay.get(day).length}`;
    b.onclick = () => { selectedDay = day; render(); };
    strip.append(b);
  }

  if (!map) {
    map = L.map('map', { scrollWheelZoom: false }).setView([50.0755, 14.4378], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);
  }
  if (layer) layer.remove();
  layer = L.layerGroup().addTo(map);

  const today = byDay.get(selectedDay) || [];
  // one pin per venue: several events at the same place would otherwise stack invisibly
  const byVenue = new Map();
  let unplaced = 0;
  for (const e of today) {
    if (!places[e.venue]) { unplaced++; continue; }
    (byVenue.get(e.venue) || byVenue.set(e.venue, []).get(e.venue)).push(e);
  }

  const bounds = [];
  for (const [venue, list] of byVenue) {
    const [lat, lng] = places[venue];
    bounds.push([lat, lng]);
    const colour = catColor(list[0].category);
    const marker = L.marker([lat, lng], {
      icon: L.divIcon({
        className: '',
        html: `<div class="pin" style="background:${colour}"><span>${list.length > 1 ? list.length : ''}</span></div>`,
        iconSize: [26, 26], iconAnchor: [13, 26],
      }),
    }).addTo(layer);

    const rows = list.slice(0, 6).map(e =>
      `<div class="row">${e.time ? `<span class="t">${e.time}</span>` : ''}<span>${esc(e.title)}</span></div>`).join('');
    const more = list.length > 6 ? `<div class="row"><span class="t">+${list.length - 6} dalších</span></div>` : '';
    marker.bindTooltip(`<b>${esc(venue)}</b>${rows}${more}`,
                       { className: 'ev-tip', direction: 'top', offset: [0, -24] });

    const links = list.slice(0, 6).map(e => e.url
      ? `<div><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></div>`
      : `<div>${esc(e.title)}</div>`).join('');
    marker.bindPopup(`<b>${esc(venue)}</b>${links}`);
  }

  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  $('mapNote').textContent = `${byVenue.size} míst · ${today.length - unplaced} akcí na mapě`
    + (unplaced ? ` · ${unplaced} bez polohy` : '');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function render() {
  const shown = visible();
  const isMap = view === 'map';
  $('mapWrap').hidden = !isMap;
  $('list').hidden = isMap;
  if (isMap) { renderMap(shown); return; }

  const list = $('list');
  list.textContent = '';

  if (!shown.length) {
    list.innerHTML = '<p class="empty">Nic nenalezeno.</p>';
    return;
  }

  const today = new Date().toISOString().slice(0,10);
  let lastMonth = '', lastDay = '', dayBox = null;

  for (const e of shown) {
    const d = parse(e.date);
    const month = fmtMonth.format(d);

    if (month !== lastMonth) {
      lastMonth = month; lastDay = '';
      const h = document.createElement('div');
      h.className = 'month';
      h.textContent = month;
      list.append(h);
    }

    if (e.date !== lastDay) {
      lastDay = e.date;
      const row = document.createElement('div');
      row.className = 'day';
      const label = document.createElement('div');
      label.className = 'day-label';
      label.innerHTML = `<b class="${e.date === today ? 'soon' : ''}">${d.getDate()}.${d.getMonth()+1}.</b>${fmtDay.format(d)}`;
      dayBox = document.createElement('div');
      row.append(label, dayBox);
      list.append(row);
    }

    const ev = document.createElement('div');
    ev.className = 'ev';

    // thumbnail: lazy, and a dead/blocked image URL degrades to the placeholder box
    const thumb = document.createElement(e.url ? 'a' : 'div');
    thumb.className = 'thumb' + (e.image ? '' : ' none');
    if (e.url) { thumb.href = e.url; thumb.target = '_blank'; thumb.rel = 'noopener'; }
    const monogram = (e.venue || '?').trim()[0].toUpperCase();
    if (e.image) {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = '';
      img.src = e.image;
      img.onerror = () => { img.remove(); thumb.classList.add('none'); thumb.textContent = monogram; };
      thumb.append(img);
    } else {
      thumb.textContent = monogram;
    }

    const body = document.createElement('div');

    const title = document.createElement(e.url ? 'a' : 'span');
    title.className = 't';
    title.textContent = e.title;
    if (e.url) { title.href = e.url; title.target = '_blank'; title.rel = 'noopener'; }

    const sub = document.createElement('div');
    sub.className = 'sub';
    if (e.time) {
      const t = document.createElement('span');
      t.className = 'time';
      t.textContent = e.time;
      sub.append(t);
    }
    const v = document.createElement('span');
    v.className = 'venue';
    v.textContent = e.venue;
    sub.append(v);
    for (const [cls, val] of [['room', e.room], ['tag', e.tag]]) {
      if (!val) continue;
      const s = document.createElement('span');
      s.className = cls;
      s.textContent = val;
      sub.append(s);
    }
    if (e.end) {
      const r = document.createElement('span');
      r.textContent = '→ ' + e.end.slice(8) + '.' + Number(e.end.slice(5,7)) + '.';
      sub.append(r);
    }

    ev.append(thumb, body);
    body.append(title, sub);
    if (e.info) {
      const i = document.createElement('div');
      i.className = 'info';
      i.textContent = e.info;
      body.append(i);
    }
    dayBox.append(ev);
  }
}
</script>
</body>
</html>
