name: agenda

on:
  schedule:
    # 04:17 UTC = 06:17 Prague in summer. Deliberately off the hour: every repo that asks for
    # "6am" lands on :00 and hammers the runners at the same instant.
    - cron: "17 4 * * *"
  workflow_dispatch:      # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# never let two runs deploy at once, and let a running deploy finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet httpx beautifulsoup4 lxml pillow

      # img/ and the two caches are NOT committed -- 9 MB of thumbnails re-committed daily
      # would bloat the repo forever. They live in the Actions cache instead, so a normal run
      # re-downloads nothing and never re-spends Apify credit.
      - uses: actions/cache@v4
        with:
          path: |
            img
            .image_cache.json
            .apify_cache.json
          key: agenda-${{ github.run_id }}
          restore-keys: agenda-

      - name: self-checks
        run: |
          python3 dates.py
          python3 smoke.py

      - name: harvest
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: |
          # Apify bills per result, and Eternia posts ~5x a month -- weekly is plenty.
          EXTRA=""
          [ "$(date -u +%u)" = "1" ] && EXTRA="--social"
          python3 harvest.py --posters $EXTRA

      - name: refuse to publish an empty agenda
        run: |
          n=$(jq '.count' events.json)
          echo "harvested $n events"
          # Every source failing at once (network, a mass layout change) must not replace a
          # good site with an empty one. Failing here leaves the previous deploy live.
          [ "$n" -ge 100 ] || { echo "::error::only $n events, refusing to deploy"; exit 1; }

      - name: assemble site
        run: |
          mkdir -p _site
          cp index.html events.json _site/
          cp -r img _site/ 2>/dev/null || true
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
